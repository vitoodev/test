name: MySQL Command Check

on:
  push:
    branches: [experimental-mysql-githubactions]
  pull_request:
    branches: [master]

jobs:
  check-mysql-commands:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Check MySQL commands
        run: |
          echo "Checking MySQL commands..."
          command -v mysql || echo "mysql command not found"
          command -v mysqladmin || echo "mysqladmin command not found"
          command -v mysqldump || echo "mysqldump command not found"

          # Test MySQL connection
          mysql --version
          mysqladmin --version
          mysqldump --version

          # Verify MySQL service is running
          mysqladmin ping -h localhost -u root -proot
